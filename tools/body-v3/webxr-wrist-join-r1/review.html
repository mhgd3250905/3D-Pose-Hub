<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>腕部实际接入采样</title>
<style>
:root{color-scheme:light;font:14px/1.55 system-ui,"Segoe UI",sans-serif;color:#263743;background:#eef2f4}*{box-sizing:border-box}body{margin:0}header{padding:17px 24px;background:#fff;border-bottom:1px solid #dce4e8;display:flex;gap:16px;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0 0 2px;letter-spacing:.025em}.muted{color:#667985;font-size:12px}.pill{padding:5px 10px;border-radius:20px;background:#e8f3ee;color:#2b6950;font-size:12px;white-space:nowrap}main{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - 86px);min-height:500px}aside{padding:18px;overflow:auto;background:#f9fbfc;border-right:1px solid #dce4e8}label.field{display:block;font-weight:600;margin:0 0 15px}select,button{font:inherit;border:1px solid #cbd6dc;border-radius:7px;background:#fff;color:inherit}select{display:block;width:100%;margin-top:5px;padding:9px}button{padding:6px 10px;cursor:pointer}button:hover{background:#edf4f7}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #89bccc;outline-offset:2px}.toggles{display:flex;flex-wrap:wrap;gap:8px 14px;margin:15px 0}.toggles label{font-size:12px;display:flex;gap:5px;align-items:center}.buttons{display:flex;gap:6px;flex-wrap:wrap}.card{padding:12px;background:#fff;border:1px solid #dce4e8;border-radius:9px;margin:14px 0}.card h2{font-size:13px;margin:0 0 8px}dl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;margin:0}dt{color:#667985}dd{margin:0;overflow-wrap:anywhere}#stage{position:relative;min-width:0;overflow:hidden;background:linear-gradient(#eaf0f3,#f6f8f9)}canvas{display:block;width:100%;height:100%;touch-action:none}#stage-note{position:absolute;bottom:16px;left:20px;right:20px;pointer-events:none;font-size:12px;color:#607582;background:#ffffffda;padding:9px 12px;border-radius:7px}#busy{position:absolute;top:18px;left:20px;background:#ffffffeb;border:1px solid #dce4e8;padding:8px 13px;border-radius:7px;max-width:calc(100% - 40px)}#gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}#gallery a{color:#466573;text-decoration:none;font-size:11px}#gallery img{width:100%;display:block;border:1px solid #dce4e8;border-radius:6px;background:white}#gallery a:hover img{border-color:#4c91ac}.error{color:#a13732}.notice{font-size:12px;color:#765a2b;background:#fff8e8;border:1px solid #e7d7b8;padding:10px;border-radius:7px}details{font-size:11px;color:#667985;overflow-wrap:anywhere}summary{cursor:pointer;margin-bottom:8px}code{font-size:11px}a{color:#306f89}@media(max-width:760px){header{padding:12px 15px;align-items:start}header .pill{display:none}main{grid-template-columns:1fr;height:auto;min-height:0}aside{order:2;border:0;overflow:visible;padding:15px}#stage{height:60dvh;min-height:340px;order:1}#gallery{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}h1{font-size:18px}}
</style>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<header><div><h1>腕部实际接入采样</h1><div class="muted">切换已捕获姿态 · 旋转检查实际网格 · 不生成中间弯曲</div></div><span class="pill">本地只读查看</span></header>
<main><aside>
<label class="field">查看范围<select id="filter"><option value="primary" selected>名义范围 ≤60°</option><option value="all">全部已捕获姿态</option><option value="stress">压力测试 ＞60°（可能未通过）</option><option value="repeat">重复采样</option><option value="images">有 GPU 图片</option></select></label>
<label class="field">侧别<select id="side"><option value="left">左手</option><option value="right">右手</option></select></label>
<label class="field">已捕获姿态<select id="pose" disabled><option>正在读取采样清单…</option></select></label>
<div class="buttons"><button data-view="oblique">斜视</button><button data-view="palm">掌侧</button><button data-view="back">背侧</button><button data-view="edge">侧面</button><button id="fit">适配视野</button></div>
<div class="toggles"><label><input type="checkbox" id="db" checked>实际哑铃</label><label><input type="checkbox" id="seams">接口采样点</label><label><input type="checkbox" id="regions">区分腕带</label><label><input type="checkbox" id="wire">线框</label></div>
<div class="card"><h2>当前实际采样</h2><dl id="facts"><dt>状态</dt><dd>等待数据</dd></dl></div>
<div class="notice">三维窗口使用几何示意材质。原材质请查看实际 GPU 图；全动作尚未验收。此查看器不判定动态 QA 通过。</div>
<div class="card"><h2>整个人体接入</h2><div id="overview"></div><div class="muted">中立位实际 GPU 图，单独列示；不替代当前所选姿态的图片。</div></div>
<div class="card"><h2>同姿态 GPU PNG</h2><div id="gallery"></div><div id="image-note" class="muted"></div></div>
<details><summary>采样来源</summary><div id="source"></div></details>
</aside><section id="stage" aria-label="可旋转的实际腕部网格"><div id="busy">正在加载本地采样…</div><div id="stage-note">拖动旋转 · 滚轮缩放 · 右键平移。仅显示所选采样坐标，不插值姿态。</div></section></main>
<script type="module">
import * as T from 'three';
import {OrbitControls} from '/vendor/OrbitControls.js';
const $=id=>document.getElementById(id),stage=$('stage');
const renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.outputColorSpace=T.SRGBColorSpace;renderer.setClearColor(0x000000,0);stage.prepend(renderer.domElement);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,1,.002,20),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;controls.minDistance=.03;controls.maxDistance=3;
scene.add(new T.HemisphereLight(0xffffff,0x8b9ba6,2.4));const light=new T.DirectionalLight(0xffffff,3);light.position.set(-1,2,3);scene.add(light);const fill=new T.DirectionalLight(0xffffff,1.5);fill.position.set(2,-1,-2);scene.add(fill);
const assembly=new T.Group();scene.add(assembly);let regionMaterial,bodyMesh,dbObject,seamObject,currentReference,currentData,currentRow,manifest,selection=0,hasCamera=false,pending=false;
const skin=new T.MeshStandardMaterial({color:0xcbbfa6,roughness:.83,metalness:0}),propMaterial=new T.MeshStandardMaterial({color:0x4c5b67,roughness:.72,metalness:.12});
function draw(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;renderer.render(scene,camera);});}controls.addEventListener('change',draw);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw();}new ResizeObserver(resize).observe(stage);
const cache=new Map();async function json(url){if(cache.has(url))return cache.get(url);const task=fetch(url).then(async r=>{if(!r.ok)throw Error('无法读取 '+url+' ('+r.status+')');return r.json();});cache.set(url,task);if(cache.size>5)cache.delete(cache.keys().next().value);try{return await task;}catch(e){cache.delete(url);throw e;}}
function flat(values,name){if(!Array.isArray(values)||values.length%3||!values.length||!values.every(Number.isFinite))throw Error(name+' 缺失或不是有限 XYZ');return Float32Array.from(values);}
function geometry(positions,indices){const p=flat(positions,'实际位置'),g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));if(indices){if(!Array.isArray(indices)||indices.length%3||indices.some(i=>!Number.isInteger(i)||i<0||i>=p.length/3))throw Error('实际拓扑索引无效');g.setIndex(indices);g.computeVertexNormals();}g.computeBoundingBox();return g;}
function clear(){for(const child of [...assembly.children]){child.traverse(o=>{o.geometry?.dispose();if(o.userData.ownedMaterial)o.material.dispose();});assembly.remove(child);}regionMaterial?.dispose();regionMaterial=null;bodyMesh=dbObject=seamObject=null;}
function applyOptions(){if(dbObject)dbObject.visible=$('db').checked;if(seamObject)seamObject.visible=$('seams').checked;if(bodyMesh){bodyMesh.material.wireframe=$('wire').checked;bodyMesh.material.vertexColors=$('regions').checked;bodyMesh.material.color.set($('regions').checked?0xffffff:0xcbbfa6);bodyMesh.material.needsUpdate=true;}draw();}
function createSeams(ref,data){const positions=[];for(const pairs of Object.values(ref.seamPairs||{}))for(const pair of pairs)for(const i of pair){if(Number.isInteger(i)&&i*3+2<data.positions.length)positions.push(...data.positions.slice(i*3,i*3+3));}if(!positions.length)return null;const mat=new T.PointsMaterial({color:0x258b9b,size:3,sizeAttenuation:false,depthTest:false});const points=new T.Points(geometry(positions),mat);points.userData.ownedMaterial=true;points.renderOrder=5;return points;}
function resetCamera(view='oblique'){
 if(!bodyMesh)return;assembly.updateMatrixWorld(true);const box=new T.Box3().setFromObject(bodyMesh);if(dbObject?.visible)box.union(new T.Box3().setFromObject(dbObject));const sphere=box.getBoundingSphere(new T.Sphere()),center=sphere.center;
 const m=new T.Matrix4().fromArray(currentReference.neutralHandWorld||currentReference.handMatrixWorld),side=$('side').value,sign=side==='left'?1:-1;
 const long=new T.Vector3(sign,0,0).transformDirection(m),palm=new T.Vector3(0,-1,0).transformDirection(m),across=new T.Vector3(0,0,-sign).transformDirection(m);
 const direction=view==='palm'?palm:view==='back'?palm.clone().negate():view==='edge'?across:palm.clone().multiplyScalar(.8).addScaledVector(across,.55).addScaledVector(long,.15).normalize();
 camera.up.copy(long);camera.position.copy(center).addScaledVector(direction,Math.max(.16,sphere.radius/Math.sin(T.MathUtils.degToRad(camera.fov/2))*1.16));controls.target.copy(center);camera.near=.002;camera.far=20;camera.updateProjectionMatrix();controls.update();hasCamera=true;draw();
}
function facts(entries){const el=$('facts');el.replaceChildren();for(const [a,b]of entries){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=a;dd.textContent=b;el.append(dt,dd);}}
const deg=x=>Number.isFinite(x)?x.toFixed(2)+'°':'未提供';
function gallery(row,side){const el=$('gallery');el.replaceChildren();for(const p of row.images[side]){const link=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('span');link.href=p.url;link.target='_blank';link.rel='noopener';img.src=p.url;img.alt=row.name+' '+side+' '+p.view+' 实际 GPU PNG';img.loading='lazy';caption.textContent=p.view;link.append(img,caption);el.append(link);}$('image-note').textContent=row.images[side].length?'点击查看原始 GPU PNG。':'此侧/姿态未保存 GPU PNG；不以其它姿态图片代替。';}
function overview(){const el=$('overview');el.replaceChildren();const images=manifest.overviewImages||[];if(!images.length){el.textContent='本捕获目录未提供中立位全身图。';el.className='muted';return;}for(const p of images){const a=document.createElement('a'),img=document.createElement('img'),label=document.createElement('div');a.href=p.url;a.target='_blank';a.rel='noopener';img.src=p.url;img.alt=p.label;img.style.cssText='display:block;width:100%;max-height:230px;object-fit:contain;background:white;border:1px solid #dce4e8;border-radius:6px';label.textContent=p.label;label.className='muted';a.append(img);el.append(a,label);}}
function options(){++selection;const old=$('pose').value,side=$('side').value,f=$('filter').value;const rows=manifest.rows.filter(r=>f==='all'||f==='primary'&&r.classification==='primary'||f==='stress'&&r.classification==='stress'||f==='repeat'&&r.repeatOf||f==='images'&&r.images[side].length);$('pose').replaceChildren(...rows.map(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name+(r.repeatOf?' · 重复':'')+(r.classification==='stress'?' · 压力测试':'');return o;}));if(rows.some(r=>r.id===old))$('pose').value=old;else if(rows.length){const neutral=rows.find(r=>r.command.flexDeg===0&&r.command.twistDeg===0&&!r.repeatOf);if(neutral)$('pose').value=neutral.id;}$('pose').disabled=!rows.length;if(rows.length)loadPose();else{clear();$('busy').hidden=false;$('busy').textContent='该筛选下没有已捕获姿态';facts([['状态','未提供对应采样']]);$('gallery').replaceChildren();$('image-note').textContent='';draw();}}
async function loadPose(){const generation=++selection,side=$('side').value,row=manifest.rows.find(r=>r.id===$('pose').value);if(!row)return;assembly.visible=false;draw();$('gallery').replaceChildren();$('image-note').textContent='';$('busy').classList.remove('error');$('busy').hidden=false;$('busy').textContent='读取实际采样…';try{
 const [ref,sample]=await Promise.all([json(manifest.references[side].url),json(row.file.url)]);if(generation!==selection)return;
 const data=sample.sides?.[side]||(sample.side===side?sample:null);if(!data)throw Error('此文件没有 '+side+' 实际采样');currentReference=ref;currentData=data;currentRow=row;clear();
 const g=geometry(data.positions,ref.index||ref.indices);if(Array.isArray(data.normalsWorld)&&data.normalsWorld.length===data.positions.length&&data.normalsWorld.every(Number.isFinite))g.setAttribute('normal',new T.BufferAttribute(Float32Array.from(data.normalsWorld),3));const colors=new Float32Array(g.attributes.position.count*3);const base=new T.Color(0xcbbfa6),band=new T.Color(0x7faebb);for(let i=0;i<colors.length;i+=3)base.toArray(colors,i);for(const i of ref.regions?.bandVertexIds||[])if(i>=0&&i<g.attributes.position.count)band.toArray(colors,i*3);g.setAttribute('color',new T.BufferAttribute(colors,3));regionMaterial=skin.clone();bodyMesh=new T.Mesh(g,regionMaterial);assembly.add(bodyMesh);assembly.visible=true;
 let dbStatus='未提供实际顶点';if(Array.isArray(data.dbWorldPositions)&&data.dbWorldPositions.length){const index=ref.restDbIndices||ref.dbIndices;if(index){dbObject=new T.Mesh(geometry(data.dbWorldPositions,index),propMaterial);dbStatus='实际采样网格';}else{const mat=new T.PointsMaterial({color:0x4c5b67,size:2,sizeAttenuation:false});dbObject=new T.Points(geometry(data.dbWorldPositions),mat);dbObject.userData.ownedMaterial=true;dbStatus='实际点云（未提供源索引）';}assembly.add(dbObject);}
 seamObject=createSeams(ref,data);if(seamObject)assembly.add(seamObject);applyOptions();if(!hasCamera)resetCamera();
 const restore=sample.restoreCheck||{},required=['positionsNormalsExact','boneTransformsExact','cacheExact'],complete=required.every(k=>typeof restore[k]==='boolean'),restoreStatus=complete?(required.every(k=>restore[k])?'运行时还原断言通过':'运行时还原断言未通过'):'未提供完整还原断言';
 facts([['数据标记',sample.capturedAt||data.capturedAt||'未提供 actual-render 标记'],['当前侧别',side==='left'?'左手':'右手'],['实测掌屈/背伸',deg(data.actualFlexDeg)],['实测轴向旋转',deg(data.actualTwistDeg)],['实测摆动幅度',deg(data.actualSwingDeg)],['命令值',deg(row.command.flexDeg)+' / '+deg(row.command.twistDeg)],['采样状态',row.repeatOf?'重复采样：'+row.repeatOf:row.classification==='stress'?'压力测试（可能未通过）':'名义范围采样'],['几何规模',g.attributes.position.count.toLocaleString()+' 点 / '+((ref.index||ref.indices).length/3).toLocaleString()+' 面'],['哑铃',dbStatus],['缓存恢复',restoreStatus]]);
 if(row.qa?.[side]){const result=row.qa[side],dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent='独立局部检查';dd.textContent=result.passed?'当前采样通过':'当前采样未通过（'+Object.entries(result.checks).filter(([,v])=>v===false).map(([k])=>k).join('、')+'）';if(!result.passed)dd.className='error';$('facts').append(dt,dd);}
 gallery(row,side);$('busy').hidden=true;draw();
 }catch(e){if(generation!==selection)return;$('busy').hidden=false;$('busy').classList.add('error');$('busy').textContent=e.message;facts([['状态','读取失败；未生成替代姿态']]);console.error(e);}}
$('pose').addEventListener('change',loadPose);$('filter').addEventListener('change',options);$('side').addEventListener('change',()=>{hasCamera=false;options();});for(const id of ['db','seams','regions','wire'])$(id).addEventListener('change',applyOptions);for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>resetCamera(button.dataset.view));$('fit').addEventListener('click',()=>resetCamera());
try{manifest=await json('/review-manifest.json');$('source').textContent=manifest.captureDirectory+'\n报告 SHA-256: '+manifest.captureReport.sha256+'\nGPU: '+(manifest.gpu||'未提供');$('source').style.whiteSpace='pre-wrap';overview();options();}catch(e){$('busy').classList.add('error');$('busy').textContent=e.message;}
resize();
</script>
</body></html>
